<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Devdaha E.B.H. School</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--navy:#082b57;--blue:#165ea8;--gold:#c9a24b;--bg:#f5f8fc;--ink:#17324d;--muted:#66798c;--line:#dce5ef}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Manrope,Arial;background:radial-gradient(800px 500px at 0 0,rgba(22,94,168,.12),transparent 65%),radial-gradient(800px 500px at 100% 100%,rgba(201,162,58,.13),transparent 65%),var(--bg);color:var(--ink)}.card{width:min(460px,100%);padding:34px;border-radius:26px;border:1px solid var(--line);background:#fff;box-shadow:0 28px 80px rgba(8,43,87,.14)}.ey{font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--blue)}h1{font:600 clamp(2.4rem,8vw,4rem)/1 'Fraunces',serif;margin:.6rem 0 1rem;color:var(--navy)}p{color:var(--muted);line-height:1.7}label{display:block;margin:16px 0 7px;font-size:.82rem}input{width:100%;padding:14px 15px;border-radius:13px;border:1px solid #cfdbe7;background:#fff;color:var(--ink);outline:none}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(22,94,168,.1)}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:999px;background:linear-gradient(110deg,var(--gold),#e2c45f);color:#172333;font-weight:800;letter-spacing:.05em;cursor:pointer}.msg{min-height:24px;margin-top:12px;color:#b4232f;font-size:.85rem}.foot{margin-top:20px;font-size:.78rem;color:var(--muted)}.back{display:inline-block;margin-top:20px;color:var(--blue);text-decoration:none}</style></head><body><main class="card"><div class="ey">Devdaha E.B.H. School</div><h1>Admin Login</h1><p>Sign in to securely manage website content, notices, media, galleries, events, achievements, ECA, magazine and settings.</p><form id="login"><label>Username</label><input id="user" autocomplete="username" required><label>Password</label><input id="pass" type="password" autocomplete="current-password" required><button>Enter Admin Panel</button><div class="msg" id="msg"></div></form><div style="margin-top:12px"><a id="forgot" href="#" style="color:#165ea8;font-weight:700;text-decoration:none;font-size:.84rem">Forgot password?</a></div><div id="forgotBox" style="display:none;margin-top:14px;padding-top:14px;border-top:1px solid #dce5ef"><label>Admin username or email</label><input id="forgotIdentity" autocomplete="username"><button id="forgotBtn" type="button" style="background:#082b57;color:#fff">Send reset link</button><div id="forgotMsg" class="msg"></div></div><div class="foot">Admin credentials are validated on the server. Passwords are never stored in this page.</div><a class="back" href="Devdaha.html">← Back to website</a></main><script src="admin-system.js"></script><script>document.getElementById('forgot').onclick=e=>{e.preventDefault();document.getElementById('forgotBox').style.display='block';document.getElementById('forgotIdentity').focus()};document.getElementById('forgotBtn').onclick=async()=>{const msg=document.getElementById('forgotMsg');msg.textContent='Sending…';try{const r=await window.DEVDAHA_ADMIN.post('/api/auth/forgot-password',{username:document.getElementById('forgotIdentity').value.trim()});msg.style.color='#177245';msg.textContent=r.message||'If the account exists, a reset link has been sent.'}catch(e){msg.style.color='#b4232f';msg.textContent=e.message}}</script><script>(async()=>{const msg=document.getElementById('msg');try{await window.DEVDAHA_ADMIN.getJSON('/api/health');msg.textContent='';}catch(err){msg.textContent=err.message;}})();document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.textContent='Signing in…';try{await window.DEVDAHA_ADMIN.post('/api/auth/login',{username:document.getElementById('user').value.trim(),password:document.getElementById('pass').value});location.href='admin.html'}catch(err){msg.textContent=err.message}});</script></body></html>
