<script id="photo-fullscreen-viewer-script">
(function(){
  function initPhotoViewer(){
    const selectors='.photo-grid .photo-card img, .gallery-grid .photo-card img';
    const images=Array.from(document.querySelectorAll(selectors));
    if(!images.length || document.getElementById('photoFullscreenViewer')) return;

    const viewer=document.createElement('div');
    viewer.id='photoFullscreenViewer';
    viewer.className='photo-fullscreen-viewer';
    viewer.setAttribute('aria-hidden','true');
    viewer.innerHTML='\
      <button type="button" class="photo-fullscreen-viewer__close" aria-label="Close full-screen photo viewer">&times;</button>\
      <button type="button" class="photo-fullscreen-viewer__nav photo-fullscreen-viewer__nav--prev" aria-label="Previous photo">&#10094;</button>\
      <img class="photo-fullscreen-viewer__image" alt="School photo">\
      <button type="button" class="photo-fullscreen-viewer__nav photo-fullscreen-viewer__nav--next" aria-label="Next photo">&#10095;</button>\
      <div class="photo-fullscreen-viewer__counter" aria-live="polite"></div>';
    document.body.appendChild(viewer);

    const bigImage=viewer.querySelector('.photo-fullscreen-viewer__image');
    const prev=viewer.querySelector('.photo-fullscreen-viewer__nav--prev');
    const next=viewer.querySelector('.photo-fullscreen-viewer__nav--next');
    const close=viewer.querySelector('.photo-fullscreen-viewer__close');
    const counter=viewer.querySelector('.photo-fullscreen-viewer__counter');
    let current=-1;

    function refreshImages(){
      return Array.from(document.querySelectorAll(selectors));
    }
    function show(index){
      const list=refreshImages();
      if(!list.length) return;
      current=(index+list.length)%list.length;
      const img=list[current];
      bigImage.src=img.currentSrc || img.src;
      bigImage.alt=img.alt || 'School photo';
      counter.textContent=(current+1)+' / '+list.length;
      viewer.classList.add('is-open');
      viewer.setAttribute('aria-hidden','false');
      document.body.classList.add('photo-viewer-open');
    }
    function hide(){
      viewer.classList.remove('is-open');
      viewer.setAttribute('aria-hidden','true');
      document.body.classList.remove('photo-viewer-open');
      bigImage.removeAttribute('src');
      current=-1;
    }
    images.forEach(function(img){
      img.addEventListener('click',function(){
        const list=refreshImages();
        show(list.indexOf(img));
      });
      img.setAttribute('tabindex','0');
      img.addEventListener('keydown',function(e){
        if(e.key==='Enter' || e.key===' '){e.preventDefault(); img.click();}
      });
    });
    prev.addEventListener('click',function(e){e.stopPropagation();show(current-1);});
    next.addEventListener('click',function(e){e.stopPropagation();show(current+1);});
    close.addEventListener('click',function(e){e.stopPropagation();hide();});
    viewer.addEventListener('click',function(e){if(e.target===viewer) hide();});
    document.addEventListener('keydown',function(e){
      if(!viewer.classList.contains('is-open')) return;
      if(e.key==='ArrowLeft'){e.preventDefault();show(current-1);}
      else if(e.key==='ArrowRight'){e.preventDefault();show(current+1);}
      else if(e.key==='Escape'){e.preventDefault();hide();}
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',initPhotoViewer); else initPhotoViewer();
})();
</script>
