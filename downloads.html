(function(){
 const init=()=>{
   const candidates=[...document.querySelectorAll('section,article,.feature,.notice-card,.download-card,.photo-card,.eca-card,.principle,.life-card,.timeline-item,.hero-card,.contact-box,.testimonial,.testimonial-card,.gallery-grid,.photo-grid,.eca-grid,.downloads-grid,.devdaha-managed-block,.devdaha-cms-testimonial')]

   if('IntersectionObserver' in window){
     const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('is-visible');io.unobserve(e.target)}}),{threshold:.08,rootMargin:'0px 0px -6% 0px'});
     candidates.forEach(el=>io.observe(el));

 };

  els.forEach((el,i)=>{el.classList.add('ds-beauty-reveal');el.style.transitionDelay=Math.min((i%8)*55,350)+'ms'});
  if('IntersectionObserver' in window){
   const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('ds-in');io.unobserve(e.target)}}),{threshold:.08,rootMargin:'0px 0px -7% 0px'});els.forEach(e=>io.observe(e));
  }else els.forEach(e=>e.classList.add('ds-in'));
  const update=()=>{const h=document.documentElement.scrollHeight-innerHeight;bar.style.width=(h>0?(scrollY/h)*100:0)+'%'};addEventListener('scroll',update,{passive:true});update();
 }
 document.readyState==='loading'?document.addEventListener('DOMContentLoaded',init,{once:true}):init();
})();
</script>
</body></html>
