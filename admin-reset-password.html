<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Admin Password | Devdaha E.B.H. School</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--navy:#082b57;--blue:#165ea8;--gold:#c9a24b;--bg:#f5f8fc;--ink:#17324d;--muted:#66798c;--line:#dce5ef}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(700px 420px at 0 0,rgba(22,94,168,.12),transparent 65%),radial-gradient(700px 420px at 100% 100%,rgba(201,162,58,.13),transparent 65%),var(--bg);font-family:Manrope,Arial;color:var(--ink)}.card{width:min(470px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 20px 55px rgba(8,43,87,.12)}.ey{font-size:.72rem;letter-spacing:.16em;font-weight:800;color:var(--blue)}h1{font:600 clamp(2.1rem,8vw,3.2rem)/1 Fraunces,Georgia,serif;color:var(--navy);margin:.55rem 0 .8rem}p{color:var(--muted);line-height:1.7}label{display:block;margin:15px 0 6px;font-size:.8rem;font-weight:700}input{width:100%;padding:13px;border:1px solid #cfdbe7;border-radius:12px;font:inherit;outline:none}input:focus{border-color:#76a2cd;box-shadow:0 0 0 3px rgba(22,94,168,.1)}button{width:100%;margin-top:18px;padding:13px;border-radius:999px;border:1px solid var(--gold);background:var(--navy);color:white;font-weight:800;cursor:pointer}.msg{min-height:24px;margin-top:12px;font-size:.84rem}.back{display:inline-block;margin-top:18px;color:var(--blue);text-decoration:none;font-weight:700}</style></head><body><main class="card"><div class="ey">DEVDAHA E.B.H. SCHOOL</div><h1>Reset password</h1><p>Choose a new password for your administrator account. Use at least 10 characters with letters and numbers.</p><form id="form"><label>New password</label><input id="password" type="password" autocomplete="new-password" required minlength="10"><label>Confirm password</label><input id="confirm" type="password" autocomplete="new-password" required minlength="10"><button>Reset Password</button><div id="msg" class="msg"></div></form><a class="back" href="admin-login.html">← Back to Admin Login</a></main><script src="admin-system.js"></script><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg');const p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(p!==c){msg.textContent='Passwords do not match.';return}try{await window.DEVDAHA_ADMIN.post('/api/auth/reset-password',{token:new URLSearchParams(location.search).get('token'),password:p});msg.textContent='Password changed successfully. Redirecting…';setTimeout(()=>location.href='admin-login.html',1200)}catch(err){msg.textContent=err.message}});</script></body></html>
